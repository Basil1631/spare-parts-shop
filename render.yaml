# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: spare-parts-shop
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: SEED_ON_BOOT
        value: "false"
