# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: spare-parts-shop
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        value: file:/app/data/erp.db
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
